<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="64" cy="64" r="56" fill="url(#bgGradient)" stroke="#4c5aa1" stroke-width="2"/>
  
  <!-- Main link icon -->
  <g transform="translate(32, 32)">
    <!-- First link -->
    <rect x="12" y="20" width="20" height="8" rx="4" fill="white" opacity="0.9"/>
    <rect x="32" y="20" width="20" height="8" rx="4" fill="white" opacity="0.7"/>
    
    <!-- Second link -->
    <rect x="12" y="32" width="20" height="8" rx="4" fill="white" opacity="0.9"/>
    <rect x="32" y="32" width="20" height="8" rx="4" fill="white" opacity="0.7"/>
    
    <!-- Third link -->
    <rect x="12" y="44" width="20" height="8" rx="4" fill="white" opacity="0.9"/>
    <rect x="32" y="44" width="20" height="8" rx="4" fill="white" opacity="0.7"/>
    
    <!-- Arrow indicating opening -->
    <g transform="translate(56, 28)">
      <path d="M0,8 L8,4 L8,6 L12,6 L12,10 L8,10 L8,12 Z" fill="white"/>
    </g>
  </g>
  
  <!-- Plus symbol for "all" -->
  <g transform="translate(20, 20)">
    <circle cx="0" cy="0" r="8" fill="#28a745"/>
    <path d="M-4,0 L4,0 M0,-4 L0,4" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>