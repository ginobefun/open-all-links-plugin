<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open All Links</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <div class="logo">
        <span class="logo-icon">🔗</span>
        <span class="logo-text">Open All Links</span>
      </div>
    </div>
    
    <div class="popup-content">
      <div class="quick-actions">
        <button id="togglePanel" class="action-btn primary">
          <span class="btn-icon">⚡</span>
          <span class="btn-text">切换控制面板</span>
        </button>
        
        <button id="quickSelectAll" class="action-btn secondary">
          <span class="btn-icon">✅</span>
          <span class="btn-text">快速全选链接</span>
        </button>
      </div>
      
      <div class="stats-section">
        <h3>当前页面信息</h3>
        <div class="stat-item">
          <span class="stat-label">页面标题:</span>
          <span class="stat-value" id="pageTitle">加载中...</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">发现链接:</span>
          <span class="stat-value" id="linkCount">-</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">已选择:</span>
          <span class="stat-value" id="selectedCount">-</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">过滤模式:</span>
          <span class="stat-value" id="filterMode">智能推荐</span>
        </div>
      </div>
      
      <div class="settings-section">
        <h3>设置选项</h3>
        <div class="setting-item">
          <label class="setting-label">
            <input type="checkbox" id="openInNewWindow">
            <span class="checkmark"></span>
            在新窗口中打开链接
          </label>
        </div>
        <div class="setting-item">
          <label class="setting-label">
            <input type="checkbox" id="limitTabs" checked>
            <span class="checkmark"></span>
            限制同时打开的标签页数量
          </label>
        </div>
        <div class="setting-item">
          <label class="setting-label">
            最大标签页数量:
            <input type="range" id="maxTabs" min="5" max="50" value="20" class="range-input">
            <span id="maxTabsValue">20</span>
          </label>
        </div>
        <div class="setting-item">
          <label class="setting-label">
            <input type="checkbox" id="removeDuplicates" checked>
            <span class="checkmark"></span>
            自动去除重复链接
          </label>
        </div>
        <div class="setting-item">
          <label class="setting-label">
            打开延迟时间（毫秒）:
            <input type="range" id="openDelay" min="50" max="500" step="50" value="100" class="range-input">
            <span id="openDelayValue">100</span>
          </label>
          <small class="setting-hint">降低延迟可以更快打开，但可能被浏览器限制</small>
        </div>
        <div class="setting-item">
          <label class="setting-label">
            <input type="checkbox" id="enableLearning" checked>
            <span class="checkmark"></span>
            启用智能学习（记住选择偏好）
          </label>
        </div>
        <div class="setting-item">
          <button id="resetLearning" class="action-btn secondary small">
            <span class="btn-icon">🔄</span>
            <span class="btn-text">重置学习数据</span>
          </button>
        </div>
      </div>
      
      <div class="help-section">
        <details>
          <summary>使用说明</summary>
          <div class="help-content">
            <ol>
              <li>点击"切换控制面板"显示页面控制器</li>
              <li>点击"开启选择"激活链接选择模式</li>
              <li>选择要打开的链接</li>
              <li>点击"打开选中"批量打开链接</li>
            </ol>
          </div>
        </details>
      </div>
    </div>
    
    <div class="popup-footer">
      <div class="version">v1.0.0</div>
      <div class="links">
        <a href="#" id="helpLink">帮助</a>
        <a href="#" id="feedbackLink">反馈</a>
      </div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
